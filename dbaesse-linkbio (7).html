<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DBAESSE — Calçados Femininos</title>
<meta name="description" content="DBAESSE — Calçados femininos. Atacado, varejo e revenda.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --preto:#111111;
    --branco:#ffffff;
    --cinza:#8a8a8a;
    --linha:#e6e2dd;
    --shopee:#EE4D2D;
    --whats:#25D366;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Jost',sans-serif;
    background:var(--branco);
    color:var(--preto);
    display:flex;
    justify-content:center;
    min-height:100vh;
  }
  .page{
    width:100%;
    max-width:430px;
    padding:14px 22px 26px;
    display:flex;
    flex-direction:column;
  }

  /* ===== HERO — banner de campanha com moldura branca ===== */
  .hero{
    position:relative;
    height:190px;
    border:6px solid var(--branco);
    box-shadow:0 0 0 1px var(--linha);
    overflow:hidden;
  }
  .hero img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 55%;
    display:block;
    filter:blur(1.5px) brightness(.85);
    transform:scale(1.04);
  }
  .hero .marca{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .hero .marca h1{
    font-weight:400;
    font-size:34px;
    letter-spacing:.45em;
    text-indent:.45em;
    color:var(--branco);
    text-shadow:0 1px 10px rgba(0,0,0,.4);
  }
  .hero .marca p{
    font-weight:300;
    font-size:10px;
    letter-spacing:.38em;
    text-indent:.38em;
    text-transform:uppercase;
    color:rgba(255,255,255,.95);
    margin-top:6px;
    text-shadow:0 1px 6px rgba(0,0,0,.4);
  }

  /* ===== Rótulos de seção ===== */
  .rotulo{
    font-weight:400;
    font-size:11px;
    letter-spacing:.32em;
    text-indent:.32em;
    text-transform:uppercase;
    color:var(--preto);
    text-align:center;
    margin:24px 0 12px;
  }

  /* ===== Botões ===== */
  .botao{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:14px 18px;
    margin-bottom:10px;
    text-decoration:none;
    font-size:12px;
    font-weight:400;
    letter-spacing:.22em;
    text-indent:.22em;
    text-transform:uppercase;
    transition:background .25s,color .25s,border-color .25s;
  }
  .botao svg{width:16px;height:16px;flex-shrink:0}

  /* Atacado — preto preenchido */
  .botao.preto{
    background:var(--preto);
    color:var(--branco);
    border:1px solid var(--preto);
  }
  .botao.preto:hover{
    background:var(--whats);
    border-color:var(--whats);
  }

  /* Varejo — contornado, hover laranja Shopee */
  .botao.contorno{
    background:var(--branco);
    color:var(--preto);
    border:1px solid var(--preto);
  }
  .botao.contorno:hover{
    background:var(--shopee);
    border-color:var(--shopee);
    color:var(--branco);
  }

  /* ===== Rodapé revendedoras ===== */
  .revenda{
    margin-top:auto;
    padding-top:24px;
    border-top:1px solid var(--linha);
    text-align:center;
  }
  .revenda a{
    text-decoration:none;
    color:var(--preto);
    display:inline-block;
    transition:color .25s;
  }
  .revenda a strong{
    display:block;
    font-weight:500;
    font-size:12px;
    letter-spacing:.26em;
    text-indent:.26em;
    text-transform:uppercase;
  }
  .revenda a span{
    display:block;
    font-weight:300;
    font-size:12px;
    letter-spacing:.08em;
    color:var(--cinza);
    margin-top:5px;
    transition:color .25s;
  }
  .revenda a:hover,
  .revenda a:hover span{color:var(--whats)}

  .assinatura{
    margin-top:18px;
    text-align:center;
    font-weight:300;
    font-size:9px;
    letter-spacing:.3em;
    text-indent:.3em;
    text-transform:uppercase;
    color:#b9b3ab;
  }

  @media (prefers-reduced-motion:reduce){
    .botao,.revenda a,.revenda a span{transition:none}
  }
</style>
</head>
