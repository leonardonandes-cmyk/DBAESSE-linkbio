<style>
  :root{
    --bg:#fbfaf7;
    --ink:#141210;
    --soft:#6c655c;
    --line:#e4ded4;
    --champagne:#b8955a;
    --champagne-dark:#8a6d38;
    --shopee:#ee4d2d;
    --whats:#25d366;
    --whats-dark:#199c4b;
    --relief:#d8d3cc;
    --relief-ink:#3f3f3f;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Jost',sans-serif;
    font-weight:300;
    background:var(--bg);
    color:var(--ink);
    display:flex;
    justify-content:center;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .page{
    width:100%;
    max-width:430px;
    padding:14px 22px 30px;
    display:flex;
    flex-direction:column;
  }

  /* entrada em cascata */
  .rise{opacity:0;transform:translateY(16px);animation:rise .7s cubic-bezier(.16,.8,.3,1) forwards}
  .d1{animation-delay:.05s}.d2{animation-delay:.16s}.d3{animation-delay:.27s}
  .d4{animation-delay:.38s}.d5{animation-delay:.49s}.d6{animation-delay:.60s}.d7{animation-delay:.71s}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}

  /* ===== BANNER ===== */

    position:relative;
    height:300px;
    border:6px solid #fff;
    box-shadow:0 1px 0 var(--line), 0 14px 30px -18px rgba(20,18,16,.45);
    overflow:hidden;
  }

    animation:ken 20s ease-in-out infinite alternate;
  }
  @keyframes ken{to{transform:scale(1.14) translateY(-6px)}}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,18,16,.05) 0%,rgba(20,18,16,.02) 45%,rgba(20,18,16,.42) 100%)}
  .hero .marca{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .hero h1{
    font-weight:400;font-size:35px;letter-spacing:.46em;text-indent:.46em;color:#fff;
    text-shadow:0 1px 12px rgba(0,0,0,.35);
  }
  .hero p{
    font-weight:300;font-size:10px;letter-spacing:.4em;text-indent:.4em;text-transform:uppercase;
    color:rgba(255,255,255,.95);margin-top:8px;text-shadow:0 1px 8px rgba(0,0,0,.35);
  }

  /* ===== rótulos de seção ===== */
  .rotulo{
    text-align:center;margin:26px 0 13px;
    font-weight:500;font-size:11px;letter-spacing:.3em;text-indent:.3em;text-transform:uppercase;color:var(--ink);
  }
  .rotulo::after{content:"";display:block;width:34px;height:1px;background:var(--champagne);margin:9px auto 0}

  /* ===== botão base (relevo 3D que afunda) ===== */
  .btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;padding:15px 18px;margin-bottom:11px;
    text-decoration:none;font-size:12px;font-weight:400;
    letter-spacing:.22em;text-indent:.22em;text-transform:uppercase;
    border:1px solid transparent;cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, background .3s ease, color .3s ease, border-color .3s ease;
  }
  .btn:active{transform:translateY(4px)}
  .btn svg{width:17px;height:17px;flex-shrink:0}

  /* principal — catálogo */
  .btn.catalogo{background:var(--ink);color:#fff;box-shadow:0 5px 0 var(--relief-ink);letter-spacing:.26em;text-indent:.26em;font-weight:500}
  .btn.catalogo:hover{background:var(--champagne);box-shadow:0 5px 0 var(--champagne-dark)}
  .btn.catalogo:active{box-shadow:0 1px 0 var(--champagne-dark)}

  /* atacado — WhatsApp */
  .btn.wpp{background:var(--ink);color:#fff;box-shadow:0 5px 0 var(--relief-ink)}
  .btn.wpp:hover{background:var(--whats);box-shadow:0 5px 0 var(--whats-dark)}
  .btn.wpp:active{box-shadow:0 1px 0 var(--whats-dark)}

  /* varejo — Shopee */
  .btn.shopee{background:#fff;color:var(--ink);border-color:var(--line);box-shadow:0 5px 0 var(--relief)}
  .btn.shopee:hover{background:var(--shopee);color:#fff;border-color:var(--shopee);box-shadow:0 5px 0 #b8391f}
  .btn.shopee:active{box-shadow:0 1px 0 #b8391f}

  /* ===== redes sociais (fileira) ===== */
  .social{display:flex;gap:11px}
  .soc{
    flex:1;display:flex;align-items:center;justify-content:center;height:54px;
    text-decoration:none;color:#fff;position:relative;overflow:hidden;
    transition:transform .18s cubic-bezier(.16,.8,.3,1), box-shadow .18s ease, filter .3s ease;
  }
  .soc svg{width:22px;height:22px;position:relative;z-index:2;transition:transform .25s cubic-bezier(.16,.8,.3,1)}
  /* brilho que passa no hover */
  .soc::before{
    content:"";position:absolute;top:0;left:-120%;width:70%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);
    transform:skewX(-18deg);transition:left .55s ease;z-index:1;
  }
  .soc:hover::before{left:130%}
  .soc:hover{transform:translateY(-3px)}
  .soc:hover svg{transform:scale(1.16)}
  .soc:active{transform:translateY(4px)}
  .soc.ig{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);box-shadow:0 5px 0 #8d1263}
  .soc.ig:hover{box-shadow:0 8px 18px -6px rgba(188,24,136,.6),0 5px 0 #8d1263}
  .soc.ig:active{box-shadow:0 1px 0 #8d1263}
  .soc.tt{background:var(--ink);box-shadow:0 5px 0 var(--relief-ink)}
  .soc.tt:hover{box-shadow:0 8px 18px -6px rgba(0,0,0,.55),0 5px 0 var(--relief-ink)}
  .soc.tt:active{box-shadow:0 1px 0 var(--relief-ink)}
  .soc.th{background:var(--ink);box-shadow:0 5px 0 var(--relief-ink)}
  .soc.th:hover{box-shadow:0 8px 18px -6px rgba(0,0,0,.55),0 5px 0 var(--relief-ink)}
  .soc.th:active{box-shadow:0 1px 0 var(--relief-ink)}
  .handle{text-align:center;margin-top:12px;font-size:11px;letter-spacing:.14em;color:var(--soft)}

  /* ===== revendedoras ===== */
  .revenda{margin-top:30px;padding-top:26px;border-top:1px solid var(--line);text-align:center}
  .revenda a{text-decoration:none;color:var(--ink);display:inline-block;transition:color .25s}
  .revenda strong{display:block;font-weight:500;font-size:12px;letter-spacing:.26em;text-indent:.26em;text-transform:uppercase}
  .revenda span{display:block;font-weight:300;font-size:12px;letter-spacing:.06em;color:var(--soft);margin-top:6px;transition:color .25s}
  .revenda a:hover,.revenda a:hover span{color:var(--whats)}

  .assinatura{margin-top:22px;text-align:center;font-weight:300;font-size:9px;letter-spacing:.32em;text-indent:.32em;text-transform:uppercase;color:#bcb6ad}

  a:focus-visible,.btn:focus-visible,.soc:focus-visible{outline:2px solid var(--champagne);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){
    .rise{animation:none;opacity:1;transform:none}
    .hero .bg{animation:none}
    .btn,.soc,.revenda a{transition:none}
  }
</style>
</head>
